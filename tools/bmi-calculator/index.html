<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>mw-toolkit</title>

	<link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
	<div id="banner"></div>
	<script src="/assets/js/loader.js"></script>

	<label for="system">System: </label>
	<select id="system" value="metric">
		<option value="metric">Metric</option>
		<option value="imperial">Imperial</option>
	</select> <br>

	<label id="height-label" for="height">Height (<span id="height-unit">m</span>): </label>
	<input id="height" type="number"> <br>

	<label id="weight-label" for="weight">Weight (<span id="weight-unit">kg</span>): </label>
	<input id="weight" type="number"> <br>
	<button id="calculate">Calculate</button> <br>

	<p id="result"></p>

	<script src="/tools/bmi-calculator/bmi-calculator.js"></script>
</body>

</html>
